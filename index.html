<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090f">
<title>상권레이더 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  window.KAKAO_JS_KEY = 'adad7604fe27fca2b975f5bdae322340';
</script>
<style>
:root {
  --bg:     #07090f; --card:   #111827; --card2:  #1a2235; --border: #1e2d45;
  --cyan:   #00e5ff; --green:  #22d3a4; --yellow: #fbbf24; --red:    #ff4757;
  --text:   #e2e8f0; --dim:    #64748b; --muted:  #2a3a52;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; }

/* UI 공통 */
.topnav { position:fixed; top:0; left:0; right:0; z-index:300; height:52px; background:rgba(7,9,15,.96); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 14px; gap:10px; }
.search-bar { flex:1; background:var(--card2); border:1px solid var(--border); border-radius:22px; display:flex; align-items:center; padding:0 13px; height:36px; }
.search-bar input { flex:1; background:none; border:none; color:var(--text); font-size:.85rem; outline:none; }

#kakaoMap { position:fixed; top:52px; left:0; right:0; bottom:0; z-index:0; }
.layer-bar { position:fixed; top:60px; left:0; right:0; z-index:100; display:flex; gap:6px; padding:7px 12px; overflow-x:auto; scrollbar-width:none; }
.layer-bar::-webkit-scrollbar { display:none; }
.lbtn { flex-shrink:0; background:rgba(7,9,15,.9); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:.72rem; font-weight:700; color:var(--dim); white-space:nowrap; cursor:pointer; transition:all 0.2s;}
.lbtn.on { background:rgba(0,229,255,.12); border-color:var(--cyan); color:var(--cyan); }

/* 바텀 시트 */
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:200; background:var(--card); border-radius:20px 20px 0 0; border-top:1px solid var(--border); transition:transform .35s; max-height:92vh; display:flex; flex-direction:column; }
.sheet-peek { transform:translateY(calc(100% - 158px)); }
.sheet-half { transform:translateY(38%); }
.sheet-full { transform:translateY(0); }
.handle-wrap { display:flex; justify-content:center; padding:10px 0 6px; cursor:pointer; }
.handle { width:36px; height:4px; background:var(--muted); border-radius:2px; }
.full-area { flex:1; overflow-y:auto; padding:0 14px 24px; display:none; }
.sheet-full .full-area { display:block; }

/* 인사이트 박스 */
.insight-box { background:rgba(0,229,255,0.06); border:1px solid rgba(0,229,255,0.2); border-radius:12px; padding:16px; margin-bottom:12px; }
.mc { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.mc-l { font-size:.58rem; font-weight:700; color:var(--dim); margin-bottom:4px; }
.mc-v { font-family:'DM Mono',monospace; font-size:1.1rem; }

/* 모달 리포트 */
.modal { position:fixed; inset:0; z-index:400; background:var(--bg); transform:translateY(100%); transition:transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow-y:auto; padding:20px; padding-top:60px;}
.modal.show { transform:translateY(0); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.close-btn { font-size:1.5rem; color:var(--dim); cursor:pointer; }
.report-sec { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:16px; }
.report-t { font-size:0.9rem; font-weight:800; margin-bottom:15px; color:var(--cyan); display:flex; align-items:center; gap:8px; }

/* 로더 & 토스트 */
.loader { position:fixed; inset:0; background:rgba(7,9,15,.85); z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .22s; }
.loader.show { opacity:1; pointer-events:all; }
.lring { width:40px; height:40px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--cyan); animation:spin .75s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.toast { position:fixed; bottom:170px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--card2); border:1px solid var(--green); border-radius:10px; padding:10px 18px; font-size:.78rem; z-index:600; opacity:0; transition:all .28s; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topnav">
  <div class="logo"><div class="logo-dot"></div>상권레이더</div>
  <div class="search-bar"><input type="text" id="searchInput" placeholder="지역이나 업종 검색..."></div>
</div>

<div id="kakaoMap"></div>

<div class="layer-bar" id="categoryFilter">
  <button class="lbtn on" onclick="setCategory('', '', '전체 상가', this)">🏢 전체</button>
  <button class="lbtn" onclick="setCategory('I', 'I12', '카페/커피점', this)">☕ 카페</button>
  <button class="lbtn" onclick="setCategory('I', 'I01', '한식 식당', this)">🍚 한식</button>
  <button class="lbtn" onclick="setCategory('R', '', '학원/교육', this)">📚 학원</button>
  <button class="lbtn" onclick="setCategory('G', 'G02', '편의점', this)">🏪 편의점</button>
  <button class="lbtn" onclick="setCategory('S', 'S01', '헤어/미용', this)">✂️ 미용실</button>
</div>

<div class="sheet sheet-peek" id="sheet">
  <div class="handle-wrap" id="handleWrap"><div class="handle"></div></div>
  <div class="full-area" id="fullArea"></div>
</div>

<!-- 상세 리포트 모달 -->
<div class="modal" id="reportModal">
  <div class="modal-header">
    <h1 id="rtitle" style="font-size:1.2rem; font-weight:900;">AI 정밀 상권 분석</h1>
    <div class="close-btn" onclick="closeReport()">✕</div>
  </div>
  <div id="reportContent"></div>
</div>

<div class="loader" id="loader"><div class="lring"></div><div id="ltxt" style="font-size:.8rem; color:var(--dim); margin-top:10px;">데이터 수집 중...</div></div>
<div class="toast" id="toast"><div id="thead" style="font-weight:700; color:var(--green); font-size:.7rem;">✓</div><div id="tmsg"></div></div>

<script>
let kakaoOk = false, map = null, sheetSt = 'peek', toastTm = null;
let storeMarkers = [];
let currentLoc = { lat: 37.5571, lng: 126.9245, name: '홍대입구', addr: '마포구 서교동', lawdCd: '11440' };
let curLcls = '', curMcls = '', curName = '전체 상가';

// 전역 리포트 데이터
let reportDataCache = { bizCount: 0, insight: {}, realEstateStr: "조회 중...", realEstateDesc: "" };

const API_KEY = '1ddcc7f0063f3f004733b2651211cfe7ae0b11cc01f584205c1546bab1858c60';

// ── 1. 카카오 위경도 -> 법정동 코드(LAWD_CD) 변환 ──
function getLawdCd(lng, lat) {
  return new Promise((resolve) => {
    if(!kakaoOk) return resolve('11680'); // 폴백 (강남구)
    const geocoder = new kakao.maps.services.Geocoder();
    geocoder.coord2RegionCode(lng, lat, (result, status) => {
      if (status === kakao.maps.services.Status.OK) {
        resolve(result[0].code.substring(0, 5)); // 법정동 코드 앞 5자리 (시군구)
      } else { resolve('11680'); }
    });
  });
}

// ── 2. 국토교통부 실거래가 API (XML 파싱) ──
async function fetchRealEstateData(lawdCd) {
  // 최근 거래가 있었을 확률이 높은 1~2달 전 데이터를 조회
  const date = new Date(); date.setMonth(date.getMonth() - 2);
  const dealYmd = date.getFullYear() + String(date.getMonth() + 1).padStart(2, '0');
  
  const url = `https://apis.data.go.kr/1613000/RTMSDataSvcNrgTrade/getRTMSDataSvcNrgTrade?serviceKey=${API_KEY}&LAWD_CD=${lawdCd}&DEAL_YMD=${dealYmd}&numOfRows=50`;

  try {
    const res = await fetch(url);
    const xmlText = await res.text();
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
    const items = xmlDoc.querySelectorAll("item");

    if(items.length === 0) return null;

    let totalPrice = 0, totalArea = 0;
    items.forEach(item => {
      const priceStr = item.querySelector("거래금액")?.textContent.replace(/,/g, '') || "0";
      const areaStr = item.querySelector("건물면적")?.textContent || "0";
      totalPrice += parseInt(priceStr); // 만 원 단위
      totalArea += parseFloat(areaStr); // 제곱미터
    });

    if(totalArea === 0) return null;
    
    // 평당 가격 계산 (1평 = 3.3058 제곱미터)
    const pricePerSqm = totalPrice / totalArea;
    const pricePerPyeong = Math.round((pricePerSqm * 3.3058) / 1000); // 천만 원 단위로 변환
    
    return pricePerPyeong;
  } catch(e) {
    console.warn("국토부 실거래가 조회 실패 (CORS 또는 에러)", e);
    return null;
  }
}

// ── 3. 소상공인 상가 API ──
async function fetchBizData(lat, lng, lcls, mcls) {
  let url = `https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius?serviceKey=${API_KEY}&radius=500&cx=${lng}&cy=${lat}&type=json&numOfRows=100`;
  if(lcls) url += `&indsLclsCd=${lcls}`;
  if(mcls) url += `&indsMclsCd=${mcls}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    return data.header.resultCode === '00' ? data.body.items : null;
  } catch(e) { return null; }
}

// ── 핵심 병렬 처리 로직 ──
async function processLocation(lat, lng, name, addr) {
  currentLoc = { lat: parseFloat(lat), lng: parseFloat(lng), name, addr };
  
  if(kakaoOk) {
    map.setCenter(new kakao.maps.LatLng(lat, lng));
    drawCircle(lat, lng);
    storeMarkers.forEach(m => m.setMap(null)); storeMarkers = [];
  }

  load(1500, async () => {
    // 1. 위경도를 법정동 코드로 변환
    const lawdCd = await getLawdCd(lng, lat);
    currentLoc.lawdCd = lawdCd;

    // 2. 상가 API와 국토부 API 동시 호출! (속도 최적화)
    const [bizData, realEstatePrice] = await Promise.all([
      fetchBizData(lat, lng, curLcls, curMcls),
      fetchRealEstateData(lawdCd)
    ]);

    // 상가 데이터 처리
    reportDataCache.bizCount = bizData ? bizData.length : 0;
    if(bizData && kakaoOk) {
      bizData.forEach(shop => {
        const marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(shop.lat, shop.lon), map: map, title: shop.bizesNm });
        storeMarkers.push(marker);
      });
    }

    // 국토부 데이터 처리
    if(realEstatePrice) {
      reportDataCache.realEstateStr = `${realEstatePrice.toFixed(1)}천만 원`;
      reportDataCache.realEstateDesc = `국토교통부 실거래가 기반 (${lawdCd.substring(0,5)} 지역)`;
    } else {
      // API 실패나 데이터 없을 시 방어 로직
      reportDataCache.realEstateStr = "시세 분석 불가";
      reportDataCache.realEstateDesc = "최근 2개월 내 해당 지역 실거래 데이터 없음 (또는 API 지연)";
    }

    reportDataCache.insight = generateInsight(reportDataCache.bizCount, curName);
    
    renderSheet(name, addr, reportDataCache.bizCount, reportDataCache.insight);
    setSt('full');
    toast(`공공데이터 융합 분석 완료`);
  });
}

function generateInsight(count, category) {
  let risk = count > 30 ? '🔴 고위험' : count > 10 ? '🟡 보통' : '🟢 유망';
  let desc = count > 30 ? `해당 반경에 <b>${category}</b> 점포가 포화 상태입니다. 출혈 경쟁이 우려됩니다.` : 
             count > 10 ? `수요와 공급이 균형을 이룹니다. 타겟층(배후 아파트 등) 분석 후 진입하세요.` :
             `동일 업종이 적어 <b>블루오션</b> 가능성이 있습니다. 선점 효과를 노려볼 만합니다.`;
  return { risk, desc, score: Math.max(100 - count*2, 40) };
}

// ── 상세 리포트 모달 열기 ──
function openReport() {
  const modal = document.getElementById('reportModal');
  const content = document.getElementById('reportContent');
  
  // 매출/타겟 시뮬레이션
  const salesData = [3200, 3400, 3100, 3800, 4200, 4500];
  const targetAge = {'20대': 42, '30대': 28, '40대': 15, '기타': 15};
  
  content.innerHTML = `
    <!-- 실제 국토교통부 부동산 시세 섹션 -->
    <div class="report-sec">
      <div class="report-t">🏢 상가 시세 동향 (1평 기준)</div>
      <div style="background:var(--card2); padding:16px; border-radius:12px; border:1px solid var(--border);">
        <div style="font-size:0.65rem; color:var(--dim); margin-bottom:6px;">평당 매매가 평균</div>
        <div style="font-size:1.6rem; font-weight:900; color:var(--cyan); margin-bottom:4px;">${reportDataCache.realEstateStr}</div>
        <div style="font-size:0.65rem; color:var(--dim);">${reportDataCache.realEstateDesc}</div>
      </div>
      <p style="font-size:0.65rem; color:var(--dim); margin-top:12px; text-align:right;">* 출처: 국토교통부 OpenAPI</p>
    </div>

    <!-- 매출 분석 섹션 -->
    <div class="report-sec">
      <div class="report-t">📈 매출 성장성 추이</div>
      <div style="font-size:1.5rem; font-weight:900; color:var(--green); margin-bottom:5px;">월 평균 ${(salesData[5]).toLocaleString()}만 원</div>
      <div style="display:flex; gap:4px; height:60px; align-items:flex-end; margin-top:20px;">
        ${salesData.map(v => `<div style="flex:1; background:var(--border); height:${(v/5000)*100}%; border-radius:4px 4px 0 0;"></div>`).join('')}
      </div>
    </div>

    <div class="report-sec" style="background:rgba(255, 71, 87, 0.05); border-color:rgba(255, 71, 87, 0.2);">
      <div class="report-t" style="color:var(--red);">⚠️ 주의사항</div>
      <p style="font-size:0.8rem; line-height:1.5;">최근 상가 임대료가 가파르게 상승하는 지역일 수 있습니다. 위 국토부 평균 매매가를 참고하여 수익률을 보수적으로 산정하세요.</p>
    </div>
  `;
  modal.classList.add('show');
}

function closeReport() { document.getElementById('reportModal').classList.remove('show'); }

// ── UI 렌더링 ──
function renderSheet(name, addr, count, insight) {
  document.getElementById('fullArea').innerHTML = `
    <div style="margin-bottom:16px;">
      <h2 style="font-size:1.1rem; font-weight:900;">${name} 상권</h2>
      <p style="color:var(--dim); font-size:0.7rem;">${addr}</p>
    </div>
    
    <div class="insight-box">
      <div style="font-size:0.65rem; color:var(--cyan); font-weight:900; margin-bottom:6px;">AI 상권 분석 요약</div>
      <div style="font-size:0.9rem; font-weight:800; margin-bottom:6px;">${insight.risk} 입지</div>
      <p style="font-size:0.8rem; line-height:1.5; color:var(--text);">${insight.desc}</p>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
      <div class="mc"><div class="mc-l">${curName} 수</div><div class="mc-v">${count}개</div></div>
      <div class="mc"><div class="mc-l">입지 점수</div><div class="mc-v" style="color:var(--green)">${insight.score}점</div></div>
    </div>

    <button style="width:100%; padding:16px; background:var(--cyan); color:#000; border:none; border-radius:14px; font-weight:900; font-size:0.9rem; cursor:pointer;" onclick="openReport()">
      📄 AI 상세 분석 리포트 보기
    </button>
  `;
}

// ── 지도 및 업종 선택 ──
function setCategory(lcls, mcls, name, btn) {
  document.querySelectorAll('.lbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  curLcls = lcls; curMcls = mcls; curName = name;
  processLocation(currentLoc.lat, currentLoc.lng, currentLoc.name, currentLoc.addr);
}

function initKakao() {
  map = new kakao.maps.Map(document.getElementById('kakaoMap'), { center: new kakao.maps.LatLng(currentLoc.lat, currentLoc.lng), level:5 });
  kakao.maps.event.addListener(map, 'click', e => processLocation(e.latLng.getLat(), e.latLng.getLng(), "선택 지점", "사용자 지정 위치"));
  
  const ps = new kakao.maps.services.Places();
  document.getElementById('searchInput').onkeydown = e => {
    if(e.key === 'Enter') ps.keywordSearch(e.target.value, (data, st) => {
      if(st === kakao.maps.services.Status.OK) processLocation(data[0].y, data[0].x, data[0].place_name, data[0].address_name);
    });
  };
  processLocation(currentLoc.lat, currentLoc.lng, currentLoc.name, currentLoc.addr);
}

function drawCircle(lat, lng) {
  if(window._c) window._c.setMap(null);
  window._c = new kakao.maps.Circle({ map, center: new kakao.maps.LatLng(lat,lng), radius:500, strokeWeight:2, strokeColor:'#00e5ff', strokeStyle:'dashed', fillColor:'#00e5ff', fillOpacity:0.05 });
}

// ── 공통 헬퍼 ──
function loadKakao() {
  const sc = document.createElement('script');
  sc.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${window.KAKAO_JS_KEY}&libraries=services&autoload=false`;
  sc.onload = () => kakao.maps.load(() => { kakaoOk = true; initKakao(); });
  document.head.appendChild(sc);
}
function load(ms, cb) {
  const el = document.getElementById('loader'); el.classList.add('show');
  setTimeout(async () => { await cb(); el.classList.remove('show'); }, ms);
}
function setSt(s) { sheetSt = s; document.getElementById('sheet').className = `sheet sheet-${s}`; }
function toast(m) { const t = document.getElementById('toast'); document.getElementById('tmsg').textContent = m; t.classList.add('show'); clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.remove('show'), 2000); }

// ── 초기화 ──
document.getElementById('handleWrap').onclick = () => setSt(sheetSt==='peek'?'half':sheetSt==='half'?'full':'peek');
window.onload = loadKakao;
</script>
</body>
</html>
