<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090f">
<title>상권레이더</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  window.KAKAO_JS_KEY = 'adad7604fe27fca2b975f5bdae322340';
</script>
<style>
:root {
  --bg:     #07090f; --card:   #111827; --card2:  #1a2235; --border: #1e2d45;
  --cyan:   #00e5ff; --green:  #22d3a4; --yellow: #fbbf24; --red:    #ff4757;
  --text:   #e2e8f0; --dim:    #64748b; --muted:  #2a3a52;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; }

.topnav { position:fixed; top:0; left:0; right:0; z-index:300; height:52px; background:rgba(7,9,15,.96); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 14px; gap:10px; }
.logo { font-size:1.1rem; font-weight:900; color:var(--cyan); display:flex; align-items:center; gap:6px; }
.logo-dot { width:7px; height:7px; background:var(--cyan); border-radius:50%; animation:pdot 2s infinite; }
@keyframes pdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(1.5)} }

.search-bar { flex:1; background:var(--card2); border:1px solid var(--border); border-radius:22px; display:flex; align-items:center; padding:0 13px; gap:7px; height:36px; }
.search-bar input { flex:1; background:none; border:none; color:var(--text); font-size:.85rem; outline:none; }

#kakaoMap { position:fixed; top:52px; left:0; right:0; bottom:0; z-index:0; display:none; }
.demo-map { position:fixed; top:52px; left:0; right:0; bottom:0; z-index:0; background:#080d18; overflow:hidden; }
.demo-grid { position:absolute; inset:0; background-image: linear-gradient(rgba(30,45,69,.4) 1px,transparent 1px), linear-gradient(90deg,rgba(30,45,69,.4) 1px,transparent 1px); background-size:44px 44px; }

.layer-bar { position:fixed; top:60px; left:0; right:0; z-index:100; display:flex; gap:6px; padding:7px 12px; overflow-x:auto; scrollbar-width:none; }
.layer-bar::-webkit-scrollbar { display:none; }
.lbtn { flex-shrink:0; background:rgba(7,9,15,.9); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:.72rem; font-weight:700; color:var(--dim); white-space:nowrap; cursor:pointer; transition:all 0.2s; }
.lbtn.on { background:rgba(0,229,255,.12); border-color:var(--cyan); color:var(--cyan); }

.api-badge { position:fixed; top:106px; right:10px; z-index:101; display:flex; align-items:center; gap:4px; background:rgba(7,9,15,.9); border:1px solid var(--border); border-radius:20px; padding:4px 10px; font-size:.6rem; color:var(--dim); }
.bdot { width:5px; height:5px; border-radius:50%; background:var(--yellow); }
.bdot.live { background:var(--green); animation:pdot 1.5s infinite; }

.sheet { position:fixed; left:0; right:0; bottom:0; z-index:200; background:var(--card); border-radius:20px 20px 0 0; border-top:1px solid var(--border); transition:transform .35s; max-height:92vh; display:flex; flex-direction:column; }
.sheet-peek { transform:translateY(calc(100% - 158px)); }
.sheet-half { transform:translateY(38%); }
.sheet-full { transform:translateY(0); }
.handle-wrap { display:flex; justify-content:center; padding:10px 0 6px; flex-shrink:0; cursor:pointer; }
.handle { width:36px; height:4px; background:var(--muted); border-radius:2px; }

.peek-area { padding:0 14px 14px; flex-shrink:0; }
.full-area { flex:1; overflow-y:auto; padding:0 14px 24px; display:none; }
.sheet-full .full-area { display:block; }
.sheet-full .peek-area { display:none; }

.mc { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.mc-l { font-size:.58rem; font-weight:700; color:var(--dim); margin-bottom:5px; }
.mc-v { font-family:'DM Mono',monospace; font-size:1.2rem; }
.insight-box { background:rgba(0,229,255,0.08); border:1px solid rgba(0,229,255,0.3); border-radius:12px; padding:16px; margin-bottom:16px; }
.insight-title { font-size:0.7rem; font-weight:900; color:var(--cyan); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.insight-text { font-size:0.85rem; line-height:1.5; color:var(--text); }
.insight-text b { color:#fff; }

.loader { position:fixed; inset:0; background:rgba(7,9,15,.85); z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .22s; }
.loader.show { opacity:1; pointer-events:all; }
.lring { width:40px; height:40px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--cyan); animation:spin .75s linear infinite; margin-bottom:12px; }
@keyframes spin { to { transform:rotate(360deg); } }
.toast { position:fixed; bottom:170px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--card2); border:1px solid var(--green); border-radius:10px; padding:10px 18px; font-size:.78rem; z-index:600; opacity:0; transition:all .28s; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topnav">
  <div class="logo"><div class="logo-dot"></div>상권레이더</div>
  <div class="search-bar"><input type="text" id="searchInput" placeholder="동명, 역 이름 검색..."></div>
</div>

<div id="kakaoMap"></div>
<div class="demo-map" id="demoMap"></div>

<div class="layer-bar" id="categoryFilter">
  <button class="lbtn on" onclick="setCategory('', '전체 상가', this)">🏢 전체</button>
  <button class="lbtn" onclick="setCategory('I', '음식/카페', this)">☕ 음식·카페</button>
  <button class="lbtn" onclick="setCategory('G', '소매/편의점', this)">🛍️ 소매·마트</button>
  <button class="lbtn" onclick="setCategory('S', '서비스업', this)">✂️ 서비스업</button>
</div>

<div class="api-badge">
  <div class="bdot" id="bdot"></div>
  <span id="btxt">데모 모드</span>
</div>

<div class="sheet sheet-peek" id="sheet">
  <div class="handle-wrap" id="handleWrap"><div class="handle"></div></div>
  <div class="peek-area">
    <div style="font-size:.6rem; color:var(--dim); margin-bottom:8px;">최근 탐색</div>
    <div id="chipsRow" style="display:flex; gap:8px; overflow-x:auto;"></div>
  </div>
  <div class="full-area" id="fullArea"></div>
</div>

<div class="loader" id="loader"><div class="lring"></div><div id="ltxt" style="font-size:.8rem; color:var(--dim);">분석 중...</div></div>
<div class="toast" id="toast"><div id="thead" style="font-weight:700; color:var(--green); font-size:.7rem;">✓</div><div id="tmsg"></div></div>

<script>
let kakaoOk = false, map = null, sheetSt = 'peek', toastTm = null;
let storeMarkers = [];
let currentCenter = { lat: 37.5571, lng: 126.9245, name: '홍대입구', addr: '마포구 서교동' };
let currentCategoryCd = '';
let currentCategoryName = '전체 상가';

// ── 카테고리 설정 ──
function setCategory(cd, name, btn) {
  document.querySelectorAll('#categoryFilter .lbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  currentCategoryCd = cd;
  currentCategoryName = name;
  toast(`${name} 필터 적용! 상권을 재분석합니다.`);
  if(kakaoOk) {
    processLocation(currentCenter.lat, currentCenter.lng, currentCenter.name, currentCenter.addr);
  }
}

// ── 실시간 소상공인 API (필터 적용) ──
async function fetchBizData(lat, lng, categoryCd) {
  const API_KEY = '1ddcc7f0063f3f004733b2651211cfe7ae0b11cc01f584205c1546bab1858c60';
  let url = `https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius?serviceKey=${API_KEY}&radius=500&cx=${lng}&cy=${lat}&type=json&numOfRows=50`;
  
  // 업종 코드가 있으면 API 파라미터에 대분류(indsLclsCd) 추가
  if(categoryCd) url += `&indsLclsCd=${categoryCd}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    return data.header.resultCode === '00' ? data.body.items : null;
  } catch(e) { return null; }
}

// ── 카카오맵 초기화 ──
function loadKakao() {
  const sc = document.createElement('script');
  sc.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${window.KAKAO_JS_KEY}&libraries=services&autoload=false`;
  sc.onload = () => kakao.maps.load(() => {
    kakaoOk = true;
    document.getElementById('demoMap').style.display = 'none';
    document.getElementById('kakaoMap').style.display = 'block';
    document.getElementById('bdot').classList.add('live');
    document.getElementById('btxt').textContent = '실시간 연동 완료';
    initKakao();
  });
  document.head.appendChild(sc);
}

function initKakao() {
  map = new kakao.maps.Map(document.getElementById('kakaoMap'), { center: new kakao.maps.LatLng(currentCenter.lat, currentCenter.lng), level:5 });
  
  kakao.maps.event.addListener(map, 'click', e => {
    processLocation(e.latLng.getLat(), e.latLng.getLng(), "선택 지점", "사용자 지정 위치");
  });
  
  const ps = new kakao.maps.services.Places();
  document.getElementById('searchInput').onkeydown = e => {
    if(e.key === 'Enter') ps.keywordSearch(e.target.value, (data, st) => {
      if(st === kakao.maps.services.Status.OK) {
        processLocation(data[0].y, data[0].x, data[0].place_name, data[0].address_name || data[0].road_address_name);
      } else {
        toast('검색 결과를 찾을 수 없습니다.', '⚠ 알림');
      }
    });
  };
  
  // 최초 로딩 시 현재 위치로 분석 시작
  processLocation(currentCenter.lat, currentCenter.lng, currentCenter.name, currentCenter.addr);
}

// ── 위치 처리 및 인사이트 생성 ──
async function processLocation(lat, lng, name, addr) {
  lat = parseFloat(lat); lng = parseFloat(lng);
  currentCenter = { lat, lng, name, addr };
  
  if(kakaoOk) { 
    map.setCenter(new kakao.maps.LatLng(lat, lng)); 
    drawCircle(lat, lng); 
    
    // 기존 마커 초기화
    storeMarkers.forEach(m => m.setMap(null));
    storeMarkers = [];
    
    // 중심점 마커
    storeMarkers.push(new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng), map: map }));
  }
  
  load(1500, async () => {
    const data = await fetchBizData(lat, lng, currentCategoryCd);
    let bizCount = 0;
    
    if (data && kakaoOk) {
      bizCount = data.length;
      data.forEach(shop => {
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(shop.lat, shop.lon),
          map: map, title: shop.bizesNm
        });
        storeMarkers.push(marker);
      });
      toast(`반경 내 ${currentCategoryName} ${bizCount}개 발견!`, '✓ 스캔 완료');
    } else {
      toast('데이터 지연으로 기본값을 표시합니다.', '⚠ 네트워크 오류');
    }
    
    // AI 인사이트 생성
    let insight = generateInsight(bizCount, currentCategoryName);
    
    renderPanel(name, addr, bizCount, insight); 
    setSt('full');
  });
}

// ── 인사이트 생성 로직 ──
function generateInsight(count, category) {
  let text = '';
  let risk = '';
  
  if(count >= 40) {
    risk = '<span style="color:var(--red)">🔴 창업 위험도: 높음 (레드오션)</span>';
    text = `현재 반경 500m 내에 <b>${category}</b> 매장이 <b>${count}개 이상</b> 초밀집해 있습니다. 유동인구가 많더라도 경쟁이 극도로 치열하므로, 명확한 타겟팅과 차별화된 컨셉이 없다면 진입을 재고해야 합니다.`;
  } else if (count >= 20) {
    risk = '<span style="color:var(--yellow)">🟡 창업 위험도: 보통 (경쟁 심화)</span>';
    text = `해당 상권에 <b>${category}</b> 매장이 <b>${count}개</b> 확인됩니다. 안정적인 수요가 예상되나 경쟁점들의 매출 현황과 주요 고객층을 면밀히 분석한 후 진입하는 것이 좋습니다.`;
  } else if (count > 0) {
    risk = '<span style="color:var(--green)">🟢 창업 위험도: 낮음 (블루오션)</span>';
    text = `해당 상권 내 <b>${category}</b> 매장이 <b>${count}개</b>로 비교적 적습니다. 경쟁이 덜해 틈새 시장을 선점할 수 있는 좋은 기회일 수 있으나, 배후 세대 수요 자체를 점검할 필요가 있습니다.`;
  } else {
    risk = '<span style="color:var(--dim)">⚪ 분석 불가</span>';
    text = `해당 상권에 감지된 <b>${category}</b> 매장이 없습니다. 데이터가 누락되었거나 상권이 형성되지 않은 지역일 수 있습니다.`;
  }
  
  return { text, risk };
}

function drawCircle(lat, lng) {
  if(window._c) window._c.setMap(null);
  window._c = new kakao.maps.Circle({ map, center: new kakao.maps.LatLng(lat,lng), radius:500, strokeWeight:2, strokeColor:'#00e5ff', strokeStyle:'dashed', fillColor:'#00e5ff', fillOpacity:0.05 });
}

// ── UI 렌더링 ──
function renderPanel(name, addr, bizCount, insight) {
  document.getElementById('fullArea').innerHTML = `
    <div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border)">
      <h2 style="font-size:1.1rem; font-weight:900;">${name} 상권</h2>
      <p style="color:var(--dim); font-size:.7rem; margin-top:4px;">${addr} · 반경 500m</p>
    </div>
    
    <div class="insight-box">
      <div class="insight-title">💡 상권레이더 AI 요약</div>
      <div style="font-size:0.75rem; font-weight:700; margin-bottom:8px;">${insight.risk}</div>
      <div class="insight-text">${insight.text}</div>
    </div>
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
      <div class="mc"><div class="mc-l">선택 업종 수</div><div class="mc-v" style="color:var(--cyan)">${bizCount}개</div></div>
      <div class="mc"><div class="mc-l">데이터 출처</div><div class="mc-v" style="font-size:0.8rem; margin-top:6px;">소상공인시장진흥공단</div></div>
    </div>
    
    <button style="width:100%; padding:15px; background:var(--cyan); border:none; border-radius:12px; color:#000; font-weight:800; font-size:0.85rem; cursor:pointer;" onclick="toast('상세 리포트 준비중입니다.')">
      📄 상세 상권 분석 리포트 보기
    </button>
  `;
}

function load(ms, cb) {
  const el = document.getElementById('loader'); el.classList.add('show');
  setTimeout(async () => { await cb(); el.classList.remove('show'); }, ms);
}

function setSt(s) { sheetSt = s; document.getElementById('sheet').className = `sheet sheet-${s}`; }
function toast(m) { const t = document.getElementById('toast'); document.getElementById('tmsg').textContent = m; t.classList.add('show'); clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.remove('show'), 2000); }

// ── INIT ──
loadKakao();
document.getElementById('handleWrap').onclick = () => setSt(sheetSt==='peek'?'half':sheetSt==='half'?'full':'peek');
</script>
</body>
</html>
