<html lang="ko">
<head>

<title>상권레이더</title>

<script>

</script>
<style>
:root {
  --bg:     #07090f;
  --card:   #111827;
  --card2:  #1a2235;
  --border: #1e2d45;
  --cyan:   #00e5ff;
  --green:  #22d3a4;
  --yellow: #fbbf24;
  --red:    #ff4757;
  --text:   #e2e8f0;
  --dim:    #64748b;
  --muted:  #2a3a52;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:'Noto Sans KR',sans-serif; }

/* TOP NAV */
.topnav {
  position:fixed; top:0; left:0; right:0; z-index:300; height:52px;
  background:rgba(7,9,15,.96); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 14px; gap:10px;
}
.logo { font-size:1.1rem; font-weight:900; letter-spacing:1px; color:var(--cyan);
  display:flex; align-items:center; gap:6px; flex-shrink:0; }
.logo-dot { width:7px; height:7px; background:var(--cyan); border-radius:50%; animation:pdot 2s infinite; }
@keyframes pdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(1.5)} }

.search-bar {
  flex:1; background:var(--card2); border:1px solid var(--border); border-radius:22px;
  display:flex; align-items:center; padding:0 13px; gap:7px; height:36px;
}
.search-bar input { flex:1; background:none; border:none; color:var(--text);
  font-size:.85rem; font-family:inherit; outline:none; }
.search-bar input::placeholder { color:var(--dim); }

/* MAP */
#kakaoMap { position:fixed; top:52px; left:0; right:0; bottom:0; z-index:0; display:none; }
.demo-map { position:fixed; top:52px; left:0; right:0; bottom:0; z-index:0; background:#080d18; overflow:hidden; }
.demo-grid { position:absolute; inset:0;
  background-image: linear-gradient(rgba(30,45,69,.4) 1px,transparent 1px), linear-gradient(90deg,rgba(30,45,69,.4) 1px,transparent 1px);
  background-size:44px 44px; }
#demoCanvas { position:absolute; inset:0; width:100%; height:100%; }
#demoRing { position:absolute; border-radius:50%; border:2px dashed rgba(0,229,255,.5);
  display:none; transform:translate(-50%,-50%); pointer-events:none;
  animation:sring 22s linear infinite; }
@keyframes sring { to { transform:translate(-50%,-50%) rotate(360deg); } }

/* LAYER BAR */
.layer-bar {
  position:fixed; top:60px; left:0; right:0; z-index:100;
  display:flex; gap:6px; padding:7px 12px;
  overflow-x:auto; scrollbar-width:none;
}
.layer-bar::-webkit-scrollbar { display:none; }
.lbtn {
  flex-shrink:0; background:rgba(7,9,15,.9); backdrop-filter:blur(8px);
  border:1px solid var(--border); border-radius:20px; padding:6px 14px;
  font-size:.72rem; font-weight:700; color:var(--dim); cursor:pointer;
  font-family:inherit; white-space:nowrap; transition:all .18s;
}
.lbtn.on { background:rgba(0,229,255,.12); border-color:var(--cyan); color:var(--cyan); }

/* API BADGE */
.api-badge {
  position:fixed; top:106px; right:10px; z-index:101;
  display:flex; align-items:center; gap:4px;
  background:rgba(7,9,15,.9); border:1px solid var(--border);
  border-radius:20px; padding:4px 10px; font-size:.6rem; color:var(--dim);
}
.bdot { width:5px; height:5px; border-radius:50%; background:var(--yellow); }
.bdot.live { background:var(--green); animation:pdot 1.5s infinite; }

/* BOTTOM SHEET */
.sheet {
  position:fixed; left:0; right:0; bottom:0; z-index:200;
  background:var(--card); border-radius:20px 20px 0 0;
  border-top:1px solid var(--border);
  transition:transform .35s cubic-bezier(.25,.46,.45,.94);
  max-height:92vh; display:flex; flex-direction:column;
}
.sheet-peek { transform:translateY(calc(100% - 158px)); }
.sheet-half { transform:translateY(38%); }
.sheet-full { transform:translateY(0); }

.handle-wrap { display:flex; justify-content:center; padding:10px 0 6px; flex-shrink:0; cursor:pointer; }
.handle { width:36px; height:4px; background:var(--muted); border-radius:2px; }

/* PEEK content */
.peek-area { padding:0 14px 14px; flex-shrink:0; }
.peek-label {
  font-size:.6rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--dim); margin-bottom:8px; display:flex; align-items:center; gap:5px;
}
.peek-label::before { content:''; width:3px; height:3px; background:var(--cyan); border-radius:50%; }
.chips-row { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.chips-row::-webkit-scrollbar { display:none; }
.loc-chip {
  flex-shrink:0; min-width:148px; background:var(--card2);
  border:1px solid var(--border); border-radius:12px; padding:10px 13px; cursor:pointer;
  transition:all .18s;
}
.loc-chip.sel { border-color:var(--cyan); background:rgba(0,229,255,.06); }
.lc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.lc-name { font-size:.8rem; font-weight:700; }
.lc-score { font-family:'DM Mono',monospace; font-size:.7rem; padding:2px 6px; border-radius:4px; }
.sg{background:rgba(34,211,164,.14);color:var(--green);}
.sy{background:rgba(251,191,36,.14);color:var(--yellow);}
.sr{background:rgba(255,71,87,.12);color:var(--red);}
.lc-dist { font-size:.62rem; color:var(--dim); margin-bottom:5px; }
.lc-stats { display:flex; gap:8px; }
.lc-st { font-size:.62rem; color:var(--dim); }
.lc-st b { color:var(--text); }

/* FULL content */
.full-area {
  flex:1; overflow-y:auto; padding:0 14px 24px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
  display:none;
}
.sheet-full .full-area { display:block; }
.sheet-full .peek-area { display:none; }

/* Analysis styles */
.loc-header { margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.loc-header h2 { font-size:1.05rem; font-weight:900; }
.loc-header p { font-size:.68rem; color:var(--dim); margin-top:3px; }

.score-row { display:flex; align-items:center; gap:14px;
  background:var(--card2); border:1px solid var(--border);
  border-radius:14px; padding:14px 16px; margin-bottom:12px; }
.score-detail .grade { font-size:.6rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
.score-detail .tip { font-size:.74rem; color:var(--dim); line-height:1.55; }

.metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.mc { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.mc-l { font-size:.58rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); margin-bottom:5px; }
.mc-v { font-family:'DM Mono',monospace; font-size:1.2rem; margin-bottom:3px; }
.mc-c { font-size:.64rem; font-weight:700; }
.cup{color:var(--green);} .cdn{color:var(--red);}

.sec { margin-bottom:14px; }
.sec-t { font-size:.6rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--dim); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.sec-t::after { content:''; flex:1; height:1px; background:var(--border); }

.radar-box { background:var(--card2); border:1px solid var(--border); border-radius:12px;
  padding:14px; display:flex; justify-content:center; }

.hourly { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.hbars { display:flex; gap:3px; height:52px; align-items:flex-end; }
.hbar { flex:1; border-radius:2px 2px 0 0; min-width:4px; }
.hlbls { display:flex; justify-content:space-between; font-size:.55rem; color:var(--muted); margin-top:5px; }

.arow { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.a-lbl { font-size:.65rem; color:var(--dim); width:40px; text-align:right; flex-shrink:0; }
.a-trk { flex:1; height:7px; background:var(--card2); border-radius:4px; overflow:hidden; border:1px solid var(--border); }
.a-fill { height:100%; border-radius:4px; background:var(--cyan); width:0%;
  transition:width .85s cubic-bezier(.25,.46,.45,.94); }
.a-pct { font-size:.62rem; font-family:'DM Mono',monospace; color:var(--dim); width:26px; }

.comp-list { display:flex; flex-direction:column; gap:7px; }
.comp-item { background:var(--card2); border:1px solid var(--border); border-radius:10px;
  padding:11px 13px; display:flex; justify-content:space-between; align-items:center; }
.ci-name { font-size:.8rem; font-weight:600; margin-bottom:2px; }
.ci-dist { font-size:.62rem; color:var(--dim); }
.ci-sales { font-family:'DM Mono',monospace; font-size:.75rem; color:var(--dim); }

.actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:18px; }
.btn-o { background:var(--card2); border:1px solid var(--cyan); border-radius:12px;
  padding:15px; font-size:.8rem; font-weight:700; font-family:inherit;
  color:var(--cyan); cursor:pointer; }
.btn-s { background:var(--cyan); border:none; border-radius:12px;
  padding:15px; font-size:.8rem; font-weight:800; font-family:inherit;
  color:#000; cursor:pointer; }

/* Map pins */
.mpin { position:absolute; cursor:pointer; transform:translate(-50%,-100%); z-index:10; }
.mpin:active { transform:translate(-50%,-110%) scale(1.08); }
.mpin-body { width:34px; height:34px; border-radius:50% 50% 50% 0;
  transform:rotate(-45deg); display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.5); }
.mpin-icon { transform:rotate(45deg); font-size:.8rem; }
.mpin-tag { margin-top:3px; background:rgba(7,9,15,.92); border:1px solid var(--border);
  border-radius:4px; padding:2px 6px; font-size:9.5px; font-weight:700;
  color:var(--text); white-space:nowrap; text-align:center; }

/* Loader */
.loader { position:fixed; inset:0; background:rgba(7,9,15,.85); z-index:500;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .22s; }
.loader.show { opacity:1; pointer-events:all; }
.lring { width:40px; height:40px; border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--cyan);
  animation:spin .75s linear infinite; margin-bottom:12px; }
@keyframes spin { to { transform:rotate(360deg); } }
.ltxt { font-size:.8rem; color:var(--dim); }

/* Toast */
.toast { position:fixed; bottom:170px; left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--card2); border:1px solid var(--green); border-radius:10px;
  padding:10px 18px; font-size:.78rem; z-index:600;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  opacity:0; transition:all .28s; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.t-head { font-weight:700; color:var(--green); font-size:.7rem; margin-bottom:2px; }

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<div class="topnav">
  <div class="logo"><div class="logo-dot"></div>상권레이더</div>
  <div class="search-bar">
    <span style="color:var(--dim);font-size:1rem">⌕</span>
    <input type="text" id="searchInput" placeholder="동명, 역 이름 검색...">
  </div>
</div>

<div id="kakaoMap"></div>
<div class="demo-map" id="demoMap">
  <div class="demo-grid"></div>
  <canvas id="demoCanvas"></canvas>
  <div id="demoRing"></div>
  <div id="demoPins"></div>
</div>

<div class="layer-bar">
  <button class="lbtn on" id="lb-foot" onclick="setLyr('foot')">🌡 유동인구</button>
  <button class="lbtn" id="lb-biz"  onclick="setLyr('biz')">🏪 업종 분포</button>
  <button class="lbtn" id="lb-rent" onclick="setLyr('rent')">💰 임대료</button>
  <button class="lbtn" id="lb-sur"  onclick="setLyr('sur')">📈 생존율</button>
</div>

<div class="api-badge">
  <div class="bdot" id="bdot"></div>
  <span id="btxt">데모 모드</span>
</div>

<div class="sheet sheet-peek" id="sheet">
  <div class="handle-wrap" id="handleWrap">
    <div class="handle"></div>
  </div>

  <div class="peek-area">
    <div class="peek-label">추천 상권</div>
    <div class="chips-row" id="chipsRow"></div>
  </div>

  <div class="full-area" id="fullArea"></div>
</div>

<div class="loader" id="loader">
  <div class="lring"></div>
  <div class="ltxt" id="ltxt">공공데이터 연동 중...</div>
</div>

<div class="toast" id="toast">
  <div class="t-head" id="thead">✓</div>
  <div id="tmsg"></div>
</div>

<script>
// ── DATA ──────────────────────────────────────
const LOCS = [
  { id:1, name:'홍대입구', district:'마포구 서교동', lat:37.5571, lng:126.9245, score:87, grade:'S', foot:142000, footChg:12.3, sales:8420, salesChg:5.1, closure:8.2, biz:1840, rent:18.4, rentChg:2.1, sur1:68, comp:'HIGH', color:'#ef4444', time:[20,35,55,62,75,82,95,100,88,72,65,58,70,85,90,88,72,55,38,22,15,10,8,12], age:{'10대':15,'20대':38,'30대':24,'40대':13,'50대+':10}, rivals:[{n:'스타벅스 홍대점',d:120,m:4200},{n:'이디야커피',d:80,m:1800},{n:'투썸플레이스',d:200,m:2600}], radar:[.87,.68,.45,.55,.62,.80], tip:'20~30대 최다 집중. 카페·패션 강세.' },
  { id:2, name:'강남역', district:'강남구 역삼동', lat:37.4979, lng:127.0276, score:92, grade:'S+', foot:198000, footChg:8.7, sales:12300, salesChg:3.4, closure:6.1, biz:2640, rent:32.1, rentChg:4.8, sur1:72, comp:'VERY HIGH', color:'#ff6b35', time:[8,12,20,30,55,70,85,95,100,90,75,68,80,92,88,72,60,48,35,22,15,10,8,7], age:{'10대':8,'20대':28,'30대':35,'40대':20,'50대+':9}, rivals:[{n:'스타벅스 강남대로점',d:50,m:6800},{n:'폴바셋 강남점',d:150,m:3200},{n:'블루보틀',d:300,m:2900}], radar:[1.0,1.0,.25,.12,.72,.95], tip:'서울 최고 매출. 초고임대료·극심한 경쟁.' },
  { id:3, name:'성수동', district:'성동구 성수동', lat:37.5447, lng:127.0557, score:78, grade:'A', foot:67000, footChg:31.2, sales:5840, salesChg:18.6, closure:9.8, biz:920, rent:14.2, rentChg:8.4, sur1:65, comp:'MID', color:'#a855f7', time:[5,8,12,18,28,40,52,60,65,70,75,80,85,90,92,88,80,72,60,48,32,20,12,7], age:{'10대':12,'20대':42,'30대':28,'40대':12,'50대+':6}, rivals:[{n:'블루보틀 성수점',d:200,m:3500},{n:'어니언 성수점',d:180,m:4100}], radar:[.62,.55,.68,.65,.60,.72], tip:'MZ 핫플. 유동인구 급증. 임대료 빠른 상승.' },
  { id:4, name:'합정', district:'마포구 합정동', lat:37.5497, lng:126.9136, score:71, grade:'A-', foot:54000, footChg:6.8, sales:4210, salesChg:2.9, closure:11.2, biz:710, rent:10.8, rentChg:1.2, sur1:61, comp:'MID', color:'#22d3a4', time:[8,10,15,22,32,42,50,58,62,65,68,65,70,75,78,72,65,58,48,35,25,18,12,8], age:{'10대':10,'20대':35,'30대':30,'40대':16,'50대+':9}, rivals:[{n:'이디야커피 합정점',d:100,m:1600},{n:'메가커피',d:80,m:1200}], radar:[.52,.42,.60,.72,.55,.65], tip:'홍대 인접. 안정적 성장. 크리에이터 밀집.' },
];

// ── STATE ─────────────────────────────────────
let kakaoOk = false, map = null, selId = null, toastTm = null;
let startY = 0, sheetSt = 'peek';

// ── SHEET GESTURE ─────────────────────────────
const sheet = document.getElementById('sheet');
function setSt(s) { sheetSt = s; sheet.className = `sheet sheet-${s}`; }
sheet.addEventListener('touchstart', e=>{ startY=e.touches[0].clientY; },{passive:true});
sheet.addEventListener('touchend', e=>{
  const dy = e.changedTouches[0].clientY - startY;
  if (dy < -40) setSt(sheetSt==='peek'?'half':'full');
  else if (dy > 40) setSt(sheetSt==='full'?'half':'peek');
},{passive:true});
document.getElementById('handleWrap').addEventListener('click', ()=>{ setSt(sheetSt==='peek'?'half':sheetSt==='half'?'full':'peek'); });

// ── OPEN DATA API FETCH (실제 소상공인 API) ────
async function fetchBizData(lat, lng, radius = 500) {
  const baseUrl = 'https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius';
  const API_KEY = '1ddcc7f0063f3f004733b2651211cfe7ae0b11cc01f584205c1546bab1858c60';

  const params = new URLSearchParams({ serviceKey: API_KEY, pageNo: 1, numOfRows: 50, radius: radius, cx: lng, cy: lat, type: 'json' });
  try {
    const response = await fetch(`${baseUrl}?${params.toString()}`);
    if (!response.ok) throw new Error(`HTTP error!`);
    const data = await response.json();
    if (data && data.header && data.header.resultCode === '00') {
      console.log('소상공인 API 성공:', data.body.items);
      return data.body.items;
    } else {
      console.error('API 에러:', data.header?.resultMsg); return null;
    }
  } catch (error) { console.error('Fetch 실패:', error); return null; }
}

// ── KAKAO LOAD ────────────────────────────────
function loadKakao() {
  const sc = document.createElement('script');
  sc.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${window.KAKAO_JS_KEY}&libraries=services&autoload=false`;
  sc.onload = () => {
    kakao.maps.load(() => {
      kakaoOk = true;
      document.getElementById('demoMap').style.display = 'none';
      document.getElementById('kakaoMap').style.display = 'block';
      initKakao();
      document.getElementById('bdot').classList.add('live');
      document.getElementById('btxt').textContent = '실시간 연동 완료';
      toast('Kakao Map 연결 성공!', '✓ 시스템 연동');
    });
  };
  sc.onerror = () => { setTimeout(initDemo, 100); };
  document.head.appendChild(sc);
}

function initKakao() {
  map = new kakao.maps.Map(document.getElementById('kakaoMap'), {
    center: new kakao.maps.LatLng(37.5571, 126.9245), level:7,
  });

  // 기존 고정 핀 생성
  LOCS.forEach(loc => {
    const div = document.createElement('div');
    div.style.cssText = 'cursor:pointer;text-align:center';
    div.innerHTML = `
      <div style="width:34px;height:34px;background:${loc.color};border-radius:50% 50% 50% 0;
        transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;
        box-shadow:0 4px 14px ${loc.color}66;border:2px solid rgba(255,255,255,.2);margin:auto">
        <span style="transform:rotate(45deg);font-size:.8rem">📍</span></div>
      <div style="margin-top:3px;background:rgba(7,9,15,.93);border:1px solid #1e2d45;
        border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;
        color:#e2e8f0;white-space:nowrap;font-family:'Noto Sans KR',sans-serif">${loc.name}</div>`;
    div.onclick = () => selectLoc(loc.id);
    new kakao.maps.CustomOverlay({ map, content:div, position: new kakao.maps.LatLng(loc.lat, loc.lng), yAnchor:1.25 });
  });

  // 지도 빈 공간 클릭 시 동적 탐색
  kakao.maps.event.addListener(map, 'click', e => {
    const lat = e.latLng.getLat(), lng = e.latLng.getLng();
    processDynamicLocation(lat, lng, "선택한 지역");
  });

  // 🔎 검색창 로직 (동적 위치 탐색)
  const ps = new kakao.maps.services.Places();
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim(); if(!q) return;
    
    ps.keywordSearch(q, (data, st) => {
      if (st === kakao.maps.services.Status.OK) {
        const lat = parseFloat(data[0].y);
        const lng = parseFloat(data[0].x);
        const placeName = data[0].place_name;
        const address = data[0].address_name || data[0].road_address_name;
        processDynamicLocation(lat, lng, placeName, address);
      } else {
        toast('검색 결과를 찾을 수 없습니다.', '⚠ 알림');
      }
    });
  });
}

// ── 핵심 동적 위치 분석 함수 ──────────────────
function processDynamicLocation(lat, lng, placeName, address = "상세 주소 분석 중...") {
  map.setCenter(new kakao.maps.LatLng(lat, lng)); 
  map.setLevel(5);
  drawCircle(lat, lng);
  toast(`"${placeName}" 주변 공공데이터 분석 시작...`, '🔄 탐색 중');

  // 1. 임시 지역 객체 생성
  const dynamicLoc = {
    id: 999, name: placeName, district: address,
    lat: lat, lng: lng, score: '?', grade: '-',
    foot: 0, footChg: 0, sales: 0, salesChg: 0, closure: 0, biz: 0, rent: 0, rentChg: 0, sur1: 0,
    comp: '분석중', color: '#00e5ff',
    time: [10,12,15,20,30,45,60,72,75,70,65,60,65,72,75,70,65,75,80,65,45,30,20,12],
    age: {'10대':20,'20대':20,'30대':20,'40대':20,'50대+':20},
    rivals: [{n:'인근 편의점', d:150, m:2500}, {n:'인근 카페', d:200, m:1800}],
    radar: [0.5,0.5,0.5,0.5,0.5,0.5], tip: '실시간 위치 기반 시뮬레이션 리포트입니다.'
  };

  // 2. 로딩 애니메이션과 함께 API 호출
  load(2500, async () => { 
    // 실제 데이터 (상가 수)
    const liveData = await fetchBizData(lat, lng);
    
    // 시뮬레이션 데이터 (유동인구, 매출 등 랜덤 생성)
    dynamicLoc.foot = Math.floor(Math.random() * 80000) + 20000;
    dynamicLoc.footChg = (Math.random() * 10 - 5).toFixed(1);
    dynamicLoc.sales = Math.floor(Math.random() * 6000) + 2000;
    dynamicLoc.salesChg = (Math.random() * 8 - 4).toFixed(1);
    dynamicLoc.closure = (Math.random() * 12 + 5).toFixed(1);
    dynamicLoc.rent = (Math.random() * 15 + 5).toFixed(1);
    dynamicLoc.sur1 = Math.floor(Math.random() * 30) + 50;
    dynamicLoc.score = Math.floor(Math.random() * 35) + 55;
    dynamicLoc.grade = dynamicLoc.score >= 80 ? 'S' : dynamicLoc.score >= 70 ? 'A' : dynamicLoc.score >= 60 ? 'B' : 'C';
    dynamicLoc.radar = Array.from({length:6}, () => Math.random() * 0.6 + 0.3);

    // 실제 데이터 반영
    if (liveData) {
      dynamicLoc.biz = liveData.length; 
      if(dynamicLoc.biz >= 40) dynamicLoc.comp = 'VERY HIGH';
      else if(dynamicLoc.biz >= 20) dynamicLoc.comp = 'HIGH';
      else if(dynamicLoc.biz >= 10) dynamicLoc.comp = 'MID';
      else dynamicLoc.comp = 'LOW';
      toast(`반경 500m 내 상가 ${dynamicLoc.biz}개 감지 완료!`, '✓ 실시간 데이터');
    } else {
      dynamicLoc.biz = Math.floor(Math.random() * 30) + 5;
      dynamicLoc.comp = '알 수 없음';
      toast('일부 데이터를 시뮬레이션으로 대체합니다.', '⚠ 네트워크 지연');
    }

    renderPanel(dynamicLoc); 
    setSt('full'); 
  });
}

function drawCircle(lat, lng) {
  if (window._cir) window._cir.setMap(null);
  window._cir = new kakao.maps.Circle({ map,
    center: new kakao.maps.LatLng(lat,lng), radius:500,
    strokeWeight:2, strokeColor:'#00e5ff', strokeOpacity:.6, strokeStyle:'dashed',
    fillColor:'#00e5ff', fillOpacity:.04,
  });
}

// ── SELECT (기존 하드코딩 핀용) ────────────────
async function selectLoc(id) {
  const loc = LOCS.find(l => l.id === id); if(!loc) return;
  selId = id;
  document.querySelectorAll('.loc-chip').forEach(c => c.classList.remove('sel'));
  const chip = document.getElementById(`chip-${id}`);
  chip?.classList.add('sel');
  chip?.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});

  if (kakaoOk && map) {
    map.setCenter(new kakao.maps.LatLng(loc.lat, loc.lng)); map.setLevel(6);
    drawCircle(loc.lat, loc.lng);
  }

  load(1500, async () => { 
    const liveData = await fetchBizData(loc.lat, loc.lng);
    if (liveData) {
      loc.biz = liveData.length; 
      if(loc.biz >= 40) loc.comp = 'VERY HIGH';
      else if(loc.biz >= 20) loc.comp = 'HIGH';
      else if(loc.biz >= 10) loc.comp = 'MID';
      else loc.comp = 'LOW';
      toast('실시간 상가 데이터를 반영했습니다!', '✓ 업데이트');
    }
    renderPanel(loc); setSt('full'); 
  });
}

// ── CHIPS & PANEL RENDER ──────────────────────
function renderChips() { /* 생략 (기존과 동일) */ }

function renderPanel(loc) {
  const sc = loc.score>=80?'var(--green)':loc.score>=65?'var(--yellow)':'var(--red)';
  const cc = loc.comp==='LOW'?'var(--green)':loc.comp==='MID'?'var(--yellow)':'var(--red)';
  const cir = mkCircle(loc.score, sc);
  const radar = mkRadar(loc.radar, 196, ['유동','매출','경쟁','임대','생존','접근'], sc);
  const mx = Math.max(...loc.time);
  const hbars = loc.time.map((v,i)=>{
    const h = (v/mx*100).toFixed(0), night = i<6||i>=22;
    return `<div class="hbar" style="height:${h}%;background:${night?'#2a3a52':`hsl(${200-v}deg 70% 50%)`}"></div>`;
  }).join('');
  const ageBars = Object.entries(loc.age).map(([a,p])=>`
    <div class="arow">
      <div class="a-lbl">${a}</div>
      <div class="a-trk"><div class="a-fill" data-w="${p}"></div></div>
      <div class="a-pct">${p}%</div>
    </div>`).join('');
  const comps = loc.rivals.map(r=>`
    <div class="comp-item">
      <div><div class="ci-name">${r.n}</div><div class="ci-dist">${r.d}m 거리</div></div>
      <div class="ci-sales">월 ${r.m.toLocaleString()}만</div>
    </div>`).join('');
  const fs = loc.footChg>=0?'+':'', ss = loc.salesChg>=0?'+':'';

  document.getElementById('fullArea').innerHTML = `
    <div class="loc-header">
      <h2>${loc.name} 상권</h2>
      <p>${loc.district} · 반경 500m · 소상공인시장진흥공단 연동</p>
    </div>
    <div class="score-row">${cir}<div class="score-detail"><div class="grade" style="color:${sc}">입지등급 ${loc.grade}</div><div class="tip">${loc.tip}</div></div></div>
    <div class="metrics">
      <div class="mc"><div class="mc-l">일 유동인구</div><div class="mc-v">${(loc.foot/10000).toFixed(1)}만</div><div class="mc-c ${loc.footChg>=0?'cup':'cdn'}">${loc.footChg>=0?'▲':'▼'} ${fs}${Math.abs(loc.footChg)}%</div></div>
      <div class="mc"><div class="mc-l">월 매출 추정</div><div class="mc-v">${loc.sales.toLocaleString()}만</div><div class="mc-c ${loc.salesChg>=0?'cup':'cdn'}">${loc.salesChg>=0?'▲':'▼'} ${ss}${Math.abs(loc.salesChg)}%</div></div>
      <div class="mc"><div class="mc-l">연 폐업률</div><div class="mc-v">${loc.closure}%</div><div class="mc-c ${loc.closure<10?'cup':'cdn'}">${loc.closure<10?'양호':'주의'}</div></div>
      <div class="mc"><div class="mc-l">평당 임대료</div><div class="mc-v">${loc.rent}만</div><div class="mc-c cdn">▲ +${loc.rentChg}%</div></div>
      <div class="mc"><div class="mc-l">1년 생존율</div><div class="mc-v">${loc.sur1}%</div><div class="mc-c ${loc.sur1>=65?'cup':'cdn'}">${loc.sur1>=65?'우수':'보통'}</div></div>
      <div class="mc"><div class="mc-l">실시간 상가 수</div><div class="mc-v" style="font-size:.88rem;font-family:inherit;color:${cc}">${loc.comp}</div><div class="mc-c" style="color:${cc}">확인됨: ${loc.biz.toLocaleString()}개</div></div>
    </div>
    <div class="sec"><div class="sec-t">종합 입지 레이더</div><div class="radar-box">${radar}</div></div>
    <div class="sec"><div class="sec-t">시간대별 유동인구</div><div class="hourly"><div class="hbars">${hbars}</div><div class="hlbls"><span>0시</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div></div>
    <div class="sec"><div class="sec-t">연령대 분포</div>${ageBars}</div>
    <div class="sec"><div class="sec-t">주요 경쟁점</div><div class="comp-list">${comps}</div></div>
    <div class="actions"><button class="btn-o" onclick="toast('PDF 리포트를 준비합니다...')">📄 PDF 리포트</button><button class="btn-s" onclick="toast('관심 상권으로 저장됐습니다 ♥')">♥ 관심 저장</button></div>
    <div style="margin-top:14px;font-size:.58rem;color:var(--muted);text-align:center;line-height:1.7;border-top:1px solid var(--border);padding-top:10px">데이터: 공공데이터포털 실시간 연동 (일부 지표 시뮬레이션)</div>`;

  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll('.a-fill').forEach(el=>{ el.style.width=el.dataset.w+'%'; });
  },150));
}

// ── SVG HELPERS ───────────────────────────────
function mkCircle(score, color) {
  const r=34,cx=42,cy=42,circ=2*Math.PI*r,dash=(score/100)*circ;
  return `<svg width="84" height="84" viewBox="0 0 84 84" style="flex-shrink:0"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${circ*.25}" stroke-linecap="round"/><text x="${cx}" y="${cy-1}" text-anchor="middle" fill="${color}" font-family="'DM Mono',monospace" font-size="21" font-weight="500">${score}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" fill="var(--dim)" font-family="'DM Mono',monospace" font-size="8.5">/ 100</text></svg>`;
}
function mkRadar(vals, size, labels, stroke) {
  const cx=size/2, cy=size/2, r=size*.32, n=labels.length;
  const ang = i => (i*2*Math.PI/n)-Math.PI/2;
  let g='', ax='';
  [.25,.5,.75,1].forEach(s=>{ const pts = Array.from({length:n},(_,i)=>`${cx+r*s*Math.cos(ang(i))},${cy+r*s*Math.sin(ang(i))}`).join(' '); g+=`<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`; });
  for(let i=0;i<n;i++){ const a=ang(i); ax+=`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="var(--border)" stroke-width="1"/>`; }
  const dp = vals.map((v,i)=>`${cx+r*v*Math.cos(ang(i))},${cy+r*v*Math.sin(ang(i))}`).join(' ');
  const dots = vals.map((v,i)=>`<circle cx="${cx+r*v*Math.cos(ang(i))}" cy="${cy+r*v*Math.sin(ang(i))}" r="3.5" fill="${stroke}"/>`).join('');
  const lbs = labels.map((l,i)=>{ const a=ang(i), lx=cx+(r+20)*Math.cos(a), ly=cy+(r+20)*Math.sin(a); return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="var(--dim)" font-size="10" font-family="Noto Sans KR">${l}</text>`; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${g}${ax}<polygon points="${dp}" fill="${stroke}1a" stroke="${stroke}" stroke-width="1.5"/>${dots}${lbs}</svg>`;
}

// ── OTHER HELPERS ─────────────────────────────
function setLyr(l) {
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById(`lb-${l}`)?.classList.add('on');
  toast(`${{foot:'유동인구',biz:'업종 분포',rent:'임대료',sur:'생존율'}[l]} 레이어 전환`);
}
async function load(ms, cb) {
  const el = document.getElementById('loader'); let i=0;
  const MSGS=['카카오 맵 위치 이동 중...','공공데이터포털 통신 중...','주변 상권 정보 수집 중...','리포트 생성 중...'];
  document.getElementById('ltxt').textContent = MSGS[0]; el.classList.add('show');
  const iv = setInterval(()=>{ document.getElementById('ltxt').textContent = MSGS[++i%MSGS.length]; }, ms/4);
  await new Promise(r => setTimeout(r, ms)); 
  if(cb) await cb(); 
  clearInterval(iv); el.classList.remove('show');
}
function toast(msg, head='✓ 알림') {
  const el = document.getElementById('toast');
  document.getElementById('thead').textContent = head; document.getElementById('tmsg').textContent = msg;
  el.classList.add('show'); clearTimeout(toastTm); toastTm = setTimeout(()=>el.classList.remove('show'), 2800);
}

// ── INIT ──────────────────────────────────────
renderChips(); loadKakao();
setTimeout(()=>selectLoc(1), 2400);
</script>
